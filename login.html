<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="version" content="1.0.1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
  <title>登录 / 注册 · 清单</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <span style="font-size:28px">📋</span> 清单
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">登录</button>
        <button class="auth-tab" data-tab="register">注册</button>
      </div>

      <form id="auth-form" class="auth-form">
        <div class="form-field" id="name-field" style="display:none">
          <label class="form-label">昵称</label>
          <input id="auth-name" class="form-input" type="text" placeholder="给自己起个名字" maxlength="20">
        </div>
        <div class="form-field">
          <label class="form-label">手机号 / 邮箱</label>
          <input id="auth-account" class="form-input" type="text" placeholder="请输入手机号或邮箱" autocomplete="username">
        </div>
        <div class="form-field">
          <label class="form-label">密码</label>
          <input id="auth-password" class="form-input" type="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <div class="auth-error" id="auth-error"></div>
        <label class="form-checkbox auth-terms">
          <input id="auth-agree" type="checkbox">
          <span>我已阅读并同意 <a href="legal/agreement.html" target="_blank">用户协议</a> 和 <a href="legal/privacy.html" target="_blank">隐私政策</a></span>
        </label>
        <button type="submit" class="form-submit" id="auth-submit">登录</button>
      </form>

      <div class="auth-hint">
        返回 <a href="index.html" style="color:var(--primary)">发现</a>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    // ==================== 登录/注册 ====================
    const tabs = document.querySelectorAll('.auth-tab');
    const nameField = document.getElementById('name-field');
    const submitBtn = document.getElementById('auth-submit');
    const errEl = document.getElementById('auth-error');
    const form = document.getElementById('auth-form');
    let currentTab = 'login';

    // 根据 URL 参数决定默认 tab
    const tabParam = getQueryParam('tab');
    if (tabParam === 'register') {
      switchTab('register');
    }

    tabs.forEach(t => {
      t.addEventListener('click', () => switchTab(t.dataset.tab));
    });

    function switchTab(tab) {
      currentTab = tab;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      if (tab === 'register') {
        nameField.style.display = 'flex';
        submitBtn.textContent = '注册并登录';
      } else {
        nameField.style.display = 'none';
        submitBtn.textContent = '登录';
      }
      errEl.textContent = '';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errEl.textContent = '';

      const account = document.getElementById('auth-account').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const name = document.getElementById('auth-name').value.trim();

      if (!account) {
        errEl.textContent = '请输入账号';
        return;
      }
      if (!password) {
        errEl.textContent = '请输入密码';
        return;
      }
      if (currentTab === 'register' && !name) {
        errEl.textContent = '请输入昵称';
        return;
      }
      if (!document.getElementById('auth-agree').checked) {
        errEl.textContent = '请先同意用户协议和隐私政策';
        return;
      }

      // 演示模式（MOCK 已清空 · 方案 B1）：自动建匿名 user 到 localStorage
      // 真实场景应替换为：账号密码校验 → 后端建档 → 返 token
      const userName = (currentTab === 'register' ? name : account) || '我';
      const user = createAnonUser({
        name: userName,
        avatar: userName[0] || '我',
        avatarColor: pickRandomColor()
      });
      setCurrentUser(user.id);
      showToast(`欢迎，${user.name}`, 'success');

      // 跳转到来源页 或 首页
      const returnUrl = getQueryParam('return');
      setTimeout(() => {
        window.location.href = returnUrl || 'index.html';
      }, 600);
    });

    // 已登录用户访问登录页，直接跳走
    if (getCurrentUser()) {
      const returnUrl = getQueryParam('return');
      window.location.href = returnUrl || 'index.html';
    }
  </script>
</body>
</html>
